services:
  - type: web
    name: raft-garments-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build && npx tsx prisma/seed.ts
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
