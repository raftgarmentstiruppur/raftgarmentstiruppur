name: Supabase Keepalive

on:
  schedule:
    - cron: "0 8 */3 * *"   # every 3 days at 8:00 UTC
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf ${{ secrets.APP_URL }}/api/health || echo "Ping failed — check APP_URL secret"
