name: Keepalive (Render + Supabase)

# Pings the backend /content endpoint, which runs a DB query, to keep the
# Render backend warm and the Supabase DB active.
#
# DISABLED 2026-06-19: the cron schedule is removed because an external
# UptimeRobot monitor now pings https://raftgarmentstiruppur.onrender.com/content
# every 5 minutes (GitHub cron was unreliable — barely fired at 10-min cadence).
# Kept as a manual-only fallback; re-add the `schedule:` block below to revive it.

on:
  workflow_dispatch:          # manual trigger only (cron disabled — see note above)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend content endpoint (DB-backed)
        run: |
          URL="${{ secrets.APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://raftgarmentstiruppur.onrender.com"
          fi
          echo "Pinging $URL/content"
          # Retry to absorb Render cold starts (first hit can take 30-60s).
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL/content")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend + DB are awake."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Keepalive failed — backend/DB did not return 200 after retries."
          exit 1
